<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<title>恶魔轮盘 · 对战版（随机发弹 · 道具）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0c0f;--panel:#14181e;--panel2:#1b212a;--line:#28303c;--line2:#333b47;
  --text:#ecebe8;--dim:#9aa4b1;--faint:#69737f;
  --live:#e5484d;--live-soft:rgba(229,72,77,.14);
  --blank:#93a1b3;--blank-soft:rgba(147,161,179,.13);
  --gold:#e9b455;--gold-soft:rgba(233,180,85,.1);
}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(1100px 520px at 50% -8%,#181f29 0%,rgba(24,31,41,0) 60%),
    radial-gradient(700px 380px at 50% 108%,rgba(229,72,77,.07),rgba(0,0,0,0) 70%),
    var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 124px);
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:200;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(229,72,77,0) 30%,rgba(229,72,77,.32) 100%)}
body.flash #fx{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
body.shake #wrap{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
#wrap{max-width:560px;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.hidden{display:none!important}
.icn{width:1em;height:1em;fill:currentColor;vertical-align:-0.12em}

header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{font-size:30px;filter:drop-shadow(0 2px 8px rgba(229,72,77,.35))}
h1{font-size:17px;letter-spacing:2px}
.titles p{font-size:9.5px;letter-spacing:3px;color:var(--faint);margin-top:3px}
.hdrbtns{margin-left:auto;display:flex;gap:8px}
.hdrbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:16px}
.hdrbtn .icn{width:19px;height:19px}
.hdrbtn:active{background:#232b35}

#roundBar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
#roundBar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12.5px;font-weight:600}
.chip.active{border-color:var(--gold);color:var(--text);background:var(--gold-soft)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.chip .dot.live-dot{background:var(--live);box-shadow:0 0 8px rgba(229,72,77,.8);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.chip .done{color:var(--gold)}
.chip.win-p .done{color:#7ee2a0}
.chip.win-o .done{color:#ff8589}

.viewnote{font-size:12px;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(233,180,85,.3);border-radius:10px;padding:9px 12px;margin-bottom:10px;line-height:1.5}

.card{background:linear-gradient(180deg,#161b22,#12161c);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.card-head h2{font-size:12px;letter-spacing:3px;color:var(--dim);font-weight:700}
.sub{font-size:12px;color:var(--faint)}
em{font-style:normal}

.row1{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.badge{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--gold);border:1px solid rgba(233,180,85,.4);background:var(--gold-soft);padding:4px 10px;border-radius:999px}
.pill-remain{margin-left:auto;font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.pill-remain.grey{color:var(--faint)}

.hpbox{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:12px}
.hprow{display:flex;align-items:center;gap:10px;font-size:13px}
.hplabel{color:var(--dim);min-width:34px;font-weight:600}
.hearts{font-size:19px;letter-spacing:3px;line-height:1}
.hearts .hf{color:#ff5c60;text-shadow:0 0 8px rgba(229,72,77,.55)}
.hearts .he{color:#39424d}
.hprow.dead .hplabel{color:#c96a6d}
.cufftag{font-size:10.5px;color:#ffd27a;background:rgba(233,180,85,.12);border:1px solid rgba(233,180,85,.35);border-radius:6px;padding:2px 6px;font-weight:700}
.newsbox{margin-top:10px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;text-align:left}
.newsbox summary{cursor:pointer;list-style:none;font-size:10px;letter-spacing:2px;color:var(--faint)}
.newsbox summary::-webkit-details-marker{display:none}
.newsbox summary::before{content:"▸ ";color:var(--gold)}
.newsbox[open] summary::before{content:"▾ "}
.news-t{font-size:10px;letter-spacing:2px;color:var(--faint);margin-bottom:4px}
.news-i{font-size:11.5px;color:var(--dim);line-height:1.8}
.news-i .m{color:var(--gold);font-size:9px;border:1px solid var(--line);border-radius:4px;padding:0 3px;margin-right:5px}
.pick-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.pick-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12.5px;font-weight:700}
.pick-item .icn{width:26px;height:26px;color:var(--gold)}
.pick-item:active{background:#2a313b;border-color:var(--line2)}
.itembar-title{font-size:10.5px;letter-spacing:2px;color:var(--faint);margin:2px 0 4px}
.itembar{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.itembar::-webkit-scrollbar{display:none}
.item-slot{position:relative;width:44px;height:44px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.item-slot .cnt{position:absolute;right:2px;bottom:2px;font-size:9.5px;font-weight:800;line-height:1;color:#201607;background:var(--gold);border-radius:5px;padding:2px 4px}
.item-slot .icn{width:24px;height:24px}
button.item-slot:active{background:#2a313b;border-color:var(--line2)}
.item-slot.empty{border-style:dashed;opacity:.4;color:var(--faint)}

.prob{padding:2px 0 0;text-align:center}
.probslim{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ps{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-variant-numeric:tabular-nums}
.ps b{font-size:15.5px;font-weight:900;color:var(--text)}
.ps.live{border-color:rgba(229,72,77,.38);background:var(--live-soft)}
.ps.live b{color:#ff8589}
.ps.blank{border-color:rgba(147,161,179,.32);background:var(--blank-soft)}
.ps.blank b{color:#b7c2d0}
.ps.pct b{color:var(--gold)}
.ps.pct.hot b,.ps.pct.sure b{color:#ff8589}
.ps.pct.cold b{color:#9aa4b1}
.pill{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.live{background:var(--live-soft);border:1px solid rgba(229,72,77,.4);color:#ff8589}
.pill.blank{background:var(--blank-soft);border:1px solid rgba(147,161,179,.35);color:#b7c2d0}
.chamber{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-top:14px;min-height:36px}
.chamber .none{color:var(--faint);font-size:12px;letter-spacing:2px}
.infobar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.info-chip{font-size:11.5px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-weight:700}
.info-chip.live{color:#ff8589;border-color:rgba(229,72,77,.4);background:var(--live-soft)}
.info-chip.blank{color:#b7c2d0;border-color:rgba(147,161,179,.35);background:var(--blank-soft)}
.info-chip.gold{color:#ffd27a;border-color:rgba(233,180,85,.35);background:var(--gold-soft)}

.shell{position:relative;display:inline-block;border-radius:6px 6px 4px 4px;background:linear-gradient(180deg,var(--sc1,#3a4450),var(--sc2,#242c36));box-shadow:inset 0 -8px 12px rgba(0,0,0,.28),0 2px 5px rgba(0,0,0,.45)}
.shell::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-2px;height:11px;border-radius:3px;background:linear-gradient(180deg,#ecc76f,#a87d2e);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.shell.mini{width:19px;height:32px;color:#9aa4b1;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.shell.big{width:34px;height:56px;border-radius:8px 8px 5px 5px}
.shell.s-live{--sc1:#ff6b6e;--sc2:#c22f35}
.shell.s-blank{--sc1:#aebbcc;--sc2:#5f6b7a}

.turnline{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:11px;border-radius:12px;border:1px dashed var(--line);background:var(--panel2);font-size:13.5px;color:var(--dim)}
.turnline b{color:var(--gold);font-size:14.5px}
.turnline .swap{color:var(--faint);font-size:12px}
.turnline.thinking{border-color:rgba(233,180,85,.4);color:var(--gold);animation:blink 1.6s infinite}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:90;pointer-events:none;padding:20px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(180deg,rgba(10,12,15,0),rgba(10,12,15,.88) 36%,rgba(10,12,15,.98) 62%)}
#dock.dockhide{display:none}
.dock-in{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock-in.single{grid-template-columns:1fr}
.fire-btn{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:9px;min-height:58px;border-radius:15px;border:1px solid;font-size:15.5px;font-weight:800;letter-spacing:1px;transition:transform .08s,filter .15s}
.fire-btn:active{transform:scale(.96)}
.fire-btn:disabled{opacity:.32;pointer-events:none}
.fire-btn .fico{font-size:23px;line-height:1}
.fire-btn.self{background:linear-gradient(180deg,#1c2836,#141b25);border-color:#31465e}
.fire-btn.self:active{background:#223146}
.fire-btn.foe{background:linear-gradient(180deg,#2d1a1e,#1e1316);border-color:#5c2f34}
.fire-btn.foe:active{background:#3a2024}
#dock .cta{padding:15px}

.shots{list-style:none;display:flex;flex-direction:column;gap:8px}
.shot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.shot .no{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;min-width:30px}
.shot .who{flex:1}
.shot .mtag{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 4px;margin-right:4px}
.shot .dmg{font-size:11px;color:#c96a6d}
.shot .tag{font-weight:700;font-size:12.5px;padding:4px 11px;border-radius:999px;white-space:nowrap}
.shot.live{border-color:rgba(229,72,77,.42)}
.shot.live .tag{background:var(--live-soft);color:#ff8589}
.shot.blank .tag{background:var(--blank-soft);color:#b7c2d0}
.shot.last{box-shadow:0 0 0 1.5px rgba(233,180,85,.4)}
.empty{color:var(--faint);font-size:13px;text-align:center;padding:14px 0 4px}

.ghost{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:13px;font-weight:600}
.ghost:active{background:#232b35}
.mini{display:block;width:100%;margin-top:10px;padding:10px;border-radius:11px;border:1px dashed rgba(201,106,109,.4);color:#c96a6d;font-size:12.5px;font-weight:600;text-align:center}

.cta{display:block;width:100%;padding:16px;border-radius:14px;background:linear-gradient(180deg,#e9b455,#c98f2c);color:#201607;font-size:16px;font-weight:800;letter-spacing:1.5px;box-shadow:0 8px 24px rgba(201,143,44,.25)}
.cta:active{filter:brightness(.9)}
.cta.danger{background:linear-gradient(180deg,#ff6b6e,#d4393e);color:#fff}
#ctaPulse{animation:pulse 1.7s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,180,85,.4)}55%{box-shadow:0 0 0 12px rgba(233,180,85,0)}}

.rules{margin-top:4px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:2px 16px}
.rules summary{cursor:pointer;padding:13px 0;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:1px;list-style:none}
.rules summary::before{content:"▸ ";color:var(--gold)}
.rules[open] summary::before{content:"▾ "}
.rules ul{padding:2px 0 14px 2px;list-style:none}
.rules li{font-size:13px;color:var(--dim);line-height:1.75;padding-left:14px;position:relative}
.rules li::before{content:"·";position:absolute;left:2px;color:var(--gold);font-weight:900}
.rules b{color:var(--text)}
.footer{text-align:center;margin-top:18px;display:flex;flex-direction:column;gap:4px;align-items:center}
.link{font-size:12.5px;color:var(--faint);text-decoration:underline dotted;padding:8px}
.link.danger{color:#c96a6d}

#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%) translateY(-8px);z-index:300;background:#1f2630;border:1px solid var(--line2);color:var(--text);font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:86vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#overlay{position:fixed;inset:0;z-index:100;background:rgba(5,7,10,.84);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:24px}
.ov-box{width:100%;max-width:342px;max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#171c24,#10141a);border:1px solid var(--line);border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.65);animation:ovin .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes ovin{from{transform:scale(.85);opacity:0}}
.ov-title{font-size:13px;letter-spacing:3px;color:var(--gold);font-weight:800}
.ov-sub{margin:8px 0 16px;color:var(--dim);font-size:14px}
.ov-sub b{color:var(--text)}
.load-shells{display:flex;justify-content:center;align-items:flex-start;gap:7px;flex-wrap:wrap;min-height:62px}
.shell.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes pop{from{transform:scale(0) rotate(-14deg);opacity:0}}
.load-shells.shuffling .shell{animation:wob .42s ease-in-out infinite alternate}
@keyframes wob{from{transform:translateX(-5px) rotate(-5deg)}to{transform:translateX(5px) rotate(5deg)}}
.load-legend{display:flex;justify-content:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.load-msg{color:var(--dim);font-size:13px;min-height:20px;margin-bottom:12px;letter-spacing:1px}
.load-msg.ok{color:var(--gold)}

.r-shell{width:62px;height:102px;border-radius:12px 12px 8px 8px;margin:4px auto 2px}
.r-shell::after{height:16px;border-radius:5px}
.boomfx{font-size:46px;margin-top:-64px;animation:boomfx .6s ease-out;pointer-events:none}
@keyframes boomfx{0%{transform:scale(.3);opacity:0}45%{transform:scale(1.3);opacity:1}100%{transform:scale(1)}}
.pufffx{font-size:42px;margin-top:-58px;animation:puff 1.2s ease-out;pointer-events:none}
@keyframes puff{0%{transform:scale(.6) translateY(8px);opacity:0}30%{opacity:.9}100%{transform:scale(1.55) translateY(-12px);opacity:0}}
.r-title{font-size:28px;font-weight:900;letter-spacing:5px;margin:10px 0 4px}
.r-title.live{color:#ff5c60;text-shadow:0 0 26px rgba(229,72,77,.55)}
.r-title.blank{color:#aeb9c7}
.r-sub{color:var(--dim);font-size:13px}
.r-note{margin:12px 0 0;font-size:14px;color:var(--gold);background:rgba(233,180,85,.08);border:1px solid rgba(233,180,85,.28);padding:10px;border-radius:10px}
.r-note.stay{color:#7ee2a0;background:rgba(90,200,140,.08);border-color:rgba(90,200,140,.32)}
.r-note.dmg{color:#ff8589;background:var(--live-soft);border-color:rgba(229,72,77,.4)}
.r-note.dead{color:#ffb0b2;background:rgba(229,72,77,.18);border-color:rgba(229,72,77,.55);font-weight:800}
.r-note.warn{color:#ff8589;background:var(--live-soft);border-color:rgba(229,72,77,.45);font-weight:700}
.ov-btns{margin-top:18px;display:flex;flex-direction:column;gap:10px}

.rsv-cols{display:flex;gap:10px;margin:12px 0 4px}
.rsv-col{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.rsv-col h3{font-size:12.5px;color:var(--dim);margin-bottom:8px;font-weight:700}
.rsv-items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:34px}
.rsv-items .icn{width:24px;height:24px;color:var(--gold)}
.rsv-note{font-size:11px;color:var(--faint);margin-top:6px}

.m-icon{font-size:40px;margin-bottom:8px;color:var(--gold)}
.m-icon .icn{width:44px;height:44px}
.m-body{color:var(--dim);font-size:14px;line-height:1.7;margin:10px 0 18px}
.m-body b{color:var(--text)}
.m-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-btns .ghost{margin-top:0;justify-content:center}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.setrow .lname{display:flex;align-items:center;gap:9px;color:var(--text)}
.setrow .lname .icn{width:18px;height:18px;color:var(--gold)}
.setrow .ldesc{font-size:10.5px;color:var(--faint);margin-top:2px}
.tgl{width:52px;height:30px;border-radius:999px;background:#2a323d;position:relative;transition:.2s;flex:0 0 auto}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#8fa0b3;transition:.2s}
.tgl.on{background:rgba(233,180,85,.4)}
.tgl.on::after{left:25px;background:var(--gold)}

@media (min-width:560px){.dock-in{gap:12px}}
</style>
</head>
<body>
<div id="fx"></div>
<div id="toast"></div>
<div id="wrap">
  <header>
    <div class="logo">😈</div>
    <div class="titles">
      <h1>恶魔轮盘 · 对战版</h1>
      <p>VERSUS MODE · ITEMS ON</p>
    </div>
    <div class="hdrbtns">
      <button class="hdrbtn" data-action="settings" aria-label="道具设置"></button>
      <button class="hdrbtn" id="soundBtn" data-action="sound" aria-label="声音开关">🔊</button>
    </div>
  </header>
  <nav id="roundBar" aria-label="回合切换"></nav>
  <main id="main"></main>
</div>
<div id="dock" class="dockhide"></div>
<div id="overlay" class="hidden"></div>

<script>
'use strict';
var KEY='buckshot-vs-v3';
var SETKEY='buckshot-vs-settings-v1';
function $(s){return document.querySelector(s)}
function other(p){return p==='player'?'opponent':'player'}
var NAME={player:'玩家',opponent:'对方'};
var TARGET={self:'自己',other:'对方'};

var ITEMS={
  cigarette:{n:'香烟',d:'回复 1♥（不超过本回合初始血量）'},
  pill:{n:'过期止痛药',d:'50% 回复 2♥（封顶）/ 50% 失去 1♥（可致死）'},

function randInt(n){
  var u=new Uint32Array(1),lim=Math.floor(4294967296/n)*n,v;
  do{crypto.getRandomValues(u);v=u[0]}while(v>=lim);

}
function shuffled(arr){

  for(i=a.length-1;i>0;i--){j=randInt(i+1);t=a[i];a[i]=a[j];a[j]=t}

}

function saveSettings(){try{localStorage.setItem(SETKEY,JSON.stringify(settings))}catch(e){}}
function enabledItemKeys(){var a=[],k;for(k in settings.items)if(settings.items[k])a.push(k);return a}

/* ---------------- 状态 ---------------- */
function loadState(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.rounds)&&s.rounds.length){
    for(var i=0;i<s.rounds.length;i++)if(!s.rounds[i].dbl)s.rounds[i].dbl={player:0,opponent:0};
    return s}}catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function curRound(){return state.rounds[state.rounds.length-1]}
function isViewingCurrent(){return state.view===state.rounds.length-1}
function statOf(r){
  var rem=r.order.length,live=0,i;
  for(i=0;i<rem;i++)if(r.order[i]==='live')live++;
  return {rem:rem,liveRem:live,blankRem:rem-live};
}
function getHp(side,r){return side==='player'?r.hpP:r.hpO}
function setHp(side,v,r){v=Math.max(0,Math.min(r.hpMax,v));if(side==='player')r.hpP=v;else r.hpO=v;return v}
function deadOf(r){return r.hpP<=0||r.hpO<=0}
function shiftKnown(k){
  var o={},p;
  for(p in k){var n=parseInt(p,10)-1;if(n>=1)o[n]=k[p]}
  return o;
}
/* 装填：2/4/8 发，实弹与空包数量差 ≤ 2，且至少各 1 发 */
function makeLoad(){
  var N=[2,4,8][randInt(3)];
  var minL=Math.max(1,Math.ceil((N-2)/2));
  var maxL=Math.min(N-1,Math.floor((N+2)/2));
  var L=minL+randInt(maxL-minL+1);
  var shells=[],i;
  for(i=0;i<L;i++)shells.push('live');
  for(i=0;i<N-L;i++)shells.push('blank');
  return {N:N,L:L,order:shuffled(shells)};
}
function pushRound(m,r){
  var load=makeLoad();
  var hp=(randInt(2)===0)?2:4;
  var rd={
    m:m,r:r,N:load.N,L:load.L,order:load.order,
    mag:1,loads:[{N:load.N,L:load.L}],pastShots:[],fired:[],
    hpMax:hp,hpP:hp,hpO:hp,turn:'player',cuffed:null,
    items:{player:[],opponent:[]},dbl:{player:0,opponent:0},known:{},lastEject:null,
    winner:null,itemLog:[],seq:0
  };
  state.rounds.push(rd);
  state.view=state.rounds.length-1;
  var deal=dealItems(rd);
  save();render();
  showLoad(rd,deal);
}
function startMatch(){
  var m=state.rounds.length?state.rounds[state.rounds.length-1].m+1:1;
  pushRound(m,1);
}
function startRoundNext(){
  var last=state.rounds[state.rounds.length-1];
  pushRound(last.m,last.r+1);
}
function matchWins(m){
  var p=0,o=0,i;
  for(i=0;i<state.rounds.length;i++){
    var rd=state.rounds[i];
    if(rd.m===m&&rd.winner){if(rd.winner==='player')p++;else o++}
  }
  return {p:p,o:o};
}
function matchStats(m){
  var s=0,i;
  for(i=0;i<state.rounds.length;i++){
    var rd=state.rounds[i];
    if(rd.m===m)s+=rd.pastShots.length+rd.fired.length;
  }
  return s;
}

/* ---------------- 开枪 ---------------- */
function fire(target){
  if(!isViewingCurrent())return;
  var r=curRound();
  if(deadOf(r))return;
  var st=statOf(r);
  if(st.rem<=0)return;
  var shooter=r.turn;
  var result=r.order[0];
  var victim=(target==='self')?shooter:other(shooter);
  var dmg=1;
  if(r.dbl[shooter]>0){dmg=2;r.dbl[shooter]--}
  r.fired.push({shooter:shooter,target:target,result:result,hpBefore:(result==='live')?getHp(victim,r):null,dmg:dmg,seq:++r.seq});
  r.order.shift();
  r.known=shiftKnown(r.known);
  if(result==='live')setHp(victim,getHp(victim,r)-dmg,r);
  var keep=(result==='blank'&&target==='self');
  var skipped=null;
  if(!keep){
    var next=other(shooter);
    if(r.cuffed===next){r.cuffed=null;skipped=next}
    else r.turn=next;
  }
  r.fired[r.fired.length-1].cuffSkip=skipped;
  save();render();
  sfx(result==='live'?'live':'blank');
  try{navigator.vibrate&&navigator.vibrate(result==='live'?[70,40,110]:25)}catch(e){}
  if(result==='live'){
    document.body.classList.remove('flash','shake');
    void document.body.offsetWidth;
    document.body.classList.add('flash','shake');
    setTimeout(function(){document.body.classList.remove('flash','shake')},650);
  }
  showReveal(shooter,target,result,victim,skipped);
}
/* 覆盖层关闭后的统一出口 */
function afterAction(){
  var r=curRound();
  if(deadOf(r)){finishRound();return}
  if(statOf(r).rem===0){dealReload();return}
}
function undo(){
  if(!isViewingCurrent())return;
  var r=curRound();
  if(r.winner)return;
  if(!r.fired.length)return;
  if(r.itemLog.length&&r.itemLog[r.itemLog.length-1].seq>r.fired[r.fired.length-1].seq){toast('道具使用不可撤销');return}
  var s=r.fired.pop();
  if(s.result==='live'&&s.hpBefore!==null){
    var victim=(s.target==='self')?s.shooter:other(s.shooter);
    setHp(victim,Math.min(r.hpMax,getHp(victim,r)+(s.dmg||1)),r);
    if(s.dmg===2)r.dbl[s.shooter]++;
  }
  if(s.cuffSkip)r.cuffed=s.cuffSkip;
  r.turn=s.shooter;
  save();render();sfx('ui');
}
function toggleTurn(){
  if(!isViewingCurrent())return;
  var r=curRound();
  if(deadOf(r))return;
  r.turn=other(r.turn);
  save();render();sfx('ui');
}
function nextAction(){
  if(!isViewingCurrent())return;
  var r=curRound();
  if(deadOf(r)){
    var w=matchWins(r.m);
    if(w.p>=2||w.o>=2||r.r>=3)showMatchEnd();
    else showRoundWin(r);
    return;
  }
  if(statOf(r).rem===0){dealReload();return}
  confirmModal({icon:'🆕',title:'放弃本局重开？',body:'当前对局进度将作废，重新开始一局（新的第 1 回合）。',ok:'重开一局',danger:true,onOk:startMatch});
}

/* ---------------- 回合 / 整局结算 ---------------- */
function finishRound(){
  var r=curRound();
  r.winner=(r.hpP<=0)?'opponent':'player';
  save();render();
  var w=matchWins(r.m);
  if(w.p>=2||w.o>=2||r.r>=3)showMatchEnd();
  else showRoundWin(r);
}
function showRoundWin(r){
  var w=matchWins(r.m);
  pendingOk=startRoundNext;
  sfx(r.winner==='player'?'win':'lose');
  openOv('<div class="ov-box modal">'
    +'<div class="m-icon">'+(r.winner==='player'?'🏆':'💀')+'</div>'
    +'<div class="r-title" style="font-size:24px;letter-spacing:3px;color:'+(r.winner==='player'?'#ffd27a':'#ff8589')+'">'+NAME[r.winner]+'赢下第 '+r.r+' 回合</div>'
    +'<div class="m-body">当前比分　你 <b>'+w.p+'</b> : <b>'+w.o+'</b> 对方'
    +'<br>下一回合血量重新随机（2 或 4），道具清空</div>'
    +'<div class="ov-btns"><button class="cta" data-action="ov-ok">进入下一回合</button>'
    +'<button class="ghost" style="justify-content:center" data-action="ov-close">先看看记录</button></div>'
    +'</div>');
}
function showMatchEnd(){
  var r=curRound(),w=matchWins(r.m);
  var youWin=w.p>w.o;
  pendingOk=startMatch;
  sfx(youWin?'win':'lose');
  openOv('<div class="ov-box modal">'
    +'<div class="m-icon">'+(youWin?'🏆':'💀')+'</div>'
    +'<div class="r-title" style="letter-spacing:3px;color:'+(youWin?'#ffd27a':'#ff8589')+'">'+(youWin?'你赢下整局！':'对方赢下整局')+'</div>'
    +'<div class="m-body">三局两胜 · 最终比分　你 <b>'+w.p+'</b> : <b>'+w.o+'</b> 对方'
    +'<br>本局共 <b>'+matchStats(r.m)+'</b> 枪</div>'
    +'<div class="ov-btns"><button class="cta" data-action="ov-ok">开新一局</button>'
    +'<button class="ghost" style="justify-content:center" data-action="ov-close">先看看记录</button></div>'
    +'</div>');
}
function wipe(){
  confirmModal({icon:'🗑️',title:'清空全部记录？',body:'将删除所有局、回合与开枪记录（道具设置保留），不可恢复。',
    ok:'全部清空',danger:true,onOk:function(){
      try{localStorage.removeItem(KEY)}catch(e){}
      var m=state.muted;
      state={rounds:[],view:-1,muted:m};
      startMatch();
    }});
}

/* ---------------- 道具 ---------------- */
function dealItems(r){
  var pool=enabledItemKeys();
  var gains={player:[],opponent:[]},dropped={player:0,opponent:0},empty=false,sides=['player','opponent'],i,j;
  if(!pool.length)return {gains:gains,dropped:dropped,empty:true};
  for(i=0;i<sides.length;i++){
    var side=sides[i];
    for(j=0;j<2;j++){
      var k=pool[randInt(pool.length)];
      if(r.items[side].length>=8)dropped[side]++;
      else {r.items[side].push(k);gains[side].push(k)}
    }
  }
  return {gains:gains,dropped:dropped,empty:false};
}
function dealReload(){
  var r=curRound();
  r.pastShots=r.pastShots.concat(r.fired.map(function(s){return {mag:r.mag,shooter:s.shooter,target:s.target,result:s.result}}));
  r.fired=[];
  var deal=dealItems(r);
  var load=makeLoad();
  r.N=load.N;r.L=load.L;r.order=load.order;
  r.mag++;r.loads.push({N:load.N,L:load.L});
  r.known={};
  pushNews(r,'重新装弹：实弹 '+load.L+' / 空包 '+(load.N-load.L)+'（构成公开）');
  save();render();
  showResupply(deal,load,r);
}
function canUseItem(side,key){
  var r=curRound();
  if(!isViewingCurrent())return {ok:false,reason:'请先返回当前回合'};
  if(deadOf(r))return {ok:false,reason:'本回合已结束'};
  if(side!==r.turn)return {ok:false,reason:'还没轮到'+NAME[side]+'行动'};
  var st=statOf(r),p,any=false;
  if(key==='cigarette'&&getHp(side,r)>=r.hpMax)return {ok:false,reason:'血量已满'};
  if(key==='cuff'&&r.cuffed===other(side))return {ok:false,reason:'对方已被铐住'};
  if(key==='dtrg'&&r.dbl[side]>0)return {ok:false,reason:'双发扳机已生效'};
  if(key==='phone'){
    if(st.rem<2)return {ok:false,reason:'剩余不足 2 发，无从探测'};
    for(p=2;p<=st.rem;p++)if(!r.known[p])any=true;
    if(!any)return {ok:false,reason:'仓内情报已全部得知'};
  }
  if(key==='mag'&&r.known[1])return {ok:false,reason:'下一发已得知'};
  if(key==='inv'&&st.rem<1)return {ok:false,reason:'弹仓已空'};
  if(key==='beer'&&st.rem<1)return {ok:false,reason:'弹仓已空'};
  if(key==='adr'&&!r.items[other(side)].length)return {ok:false,reason:'对方没有道具'};
  return {ok:true};
}
/* 情报来源日志（公开事件 + 自己的探测结果） */
function pushNews(r,txt){
  r.news=r.news||[];
  r.news.push({m:r.mag,txt:txt});
  if(r.news.length>8)r.news.shift();
}
/* 纯道具效果：不写日志、不移除道具；depth 防兴奋剂连锁递归 */
function itemEffect(side,key,stealKey,depth){
  var r=curRound(),note='',pub='';
  if(key==='cigarette'){
    setHp(side,getHp(side,r)+1,r);
    note=NAME[side]+'回复 1♥（当前 ♥×'+getHp(side,r)+'）';
    pub=NAME[side]+'点了一支香烟，回复 1♥';
  }else if(key==='pill'){
    var good=(randInt(2)===0);
    if(good){setHp(side,getHp(side,r)+2,r);note='药效不错！'+NAME[side]+'回复 2♥（当前 ♥×'+getHp(side,r)+'）'}
    else{setHp(side,getHp(side,r)-1,r);note='药过期了…'+NAME[side]+'失去 1♥（当前 ♥×'+getHp(side,r)+'）'}
    pub=NAME[side]+'吞下过期止痛药（'+(good?'+2♥':'−1♥')+'）';
  }else if(key==='cuff'){
    r.cuffed=other(side);
    note=NAME[other(side)]+'的下一次行动将被跳过';
    pub=NAME[side]+'铐住了'+NAME[other(side)];
    pushNews(r,pub+'（公开）');
  }else if(key==='phone'){
    var st=statOf(r),unk=[],p;
    for(p=2;p<=st.rem;p++)if(!r.known[p])unk.push(p);
    if(!unk.length){note='仓内情报已全部得知（浪费）';pub=NAME[side]+'用手机探测了仓内一发（无新情报）'}
    else{
      var pos=unk[randInt(unk.length)];
      r.known[pos]=r.order[pos-1];
      note='第 '+pos+' 发是'+(r.order[pos-1]==='live'?'实弹！':'空包弹');
      pub=NAME[side]+'用手机探测了仓内一发';
      pushNews(r,'手机探测：第 '+pos+' 发 = '+(r.order[pos-1]==='live'?'实弹':'空包'));
    }
  }else if(key==='mag'){
    r.known[1]=r.order[0];
    note='下一发是'+(r.order[0]==='live'?'实弹！':'空包弹');
    pub=NAME[side]+'用放大镜观察了下一发';
    pushNews(r,'放大镜：下一发 = '+(r.order[0]==='live'?'实弹':'空包'));
  }else if(key==='inv'){
    if(statOf(r).rem<1){note='弹仓已空（浪费）';pub=NAME[side]+'使用逆转器（弹仓已空）'}
    else{
      var was=r.order[0];
      r.order[0]=(was==='live')?'blank':'live';
      if(was==='live')r.L--;else r.L++;
      if(r.known[1])r.known[1]=r.order[0];
      note='下一发性质已反转'+(r.known[1]?('，现在是'+(r.order[0]==='live'?'实弹！':'空包弹')):'（弹种仍未公开）');
      pub=NAME[side]+'使用逆转器反转了下一发';
      pushNews(r,'逆转器反转了下一发（弹种未公开，概率已按反转重算）');
    }
  }else if(key==='beer'){
    if(statOf(r).rem<1){note='弹仓已空（浪费）';pub=NAME[side]+'喝下啤酒（弹仓已空）'}
    else{
      var ejected=r.order.shift();
      r.known=shiftKnown(r.known);
      r.lastEject={mag:r.mag,result:ejected};
      note='退出一发：'+(ejected==='live'?'实弹！':'空包弹')+(statOf(r).rem===0?'（弹仓已空！）':'');
      pub=NAME[side]+'喝下啤酒，退出一发：'+(ejected==='live'?'实弹':'空包');
      pushNews(r,'啤酒退出一发：'+(ejected==='live'?'实弹':'空包')+'（公开，双方概率重算）');
    }
  }else if(key==='dtrg'){
    r.dbl[side]++;
    note='下一次开枪伤害变为 2♥';
    pub=NAME[side]+'装上双发扳机，下次开枪伤害 ×2';
    pushNews(r,NAME[side]+'的双发扳机已就绪（公开）');
  }else if(key==='adr'){
    var oi=r.items[other(side)];
    if(!oi.length||(depth||0)>=3){note='没有可偷取的道具';pub=NAME[side]+'用兴奋剂（没有目标）'}
    else{
      var si2=0;
      if(stealKey){while(si2<oi.length&&oi[si2]!==stealKey)si2++}
      else si2=randInt(oi.length);
      var stolen=oi.splice(si2,1)[0];
      var sub=itemEffect(side,stolen,undefined,(depth||0)+1);
      note='偷到「'+ITEMS[stolen].n+'」并立即使用：'+sub.note;
      pub=NAME[side]+'用兴奋剂偷走了'+NAME[other(side)]+'的「'+ITEMS[stolen].n+'」并立即使用';
      pushNews(r,NAME[side]+'偷走「'+ITEMS[stolen].n+'」并立即使用（公开）');
    }
  }
  return {note:note,pub:pub};
}
/* silent=true 供 AI 静默使用；返回公开播报文本 */
function useItem(side,key,idx,silent,stealKey){
  var r=curRound();
  var eff=itemEffect(side,key,stealKey,0);
  var note=eff.note,pub=eff.pub;
  r.items[side].splice(idx,1);
  r.itemLog.push({side:side,key:key,seq:++r.seq,note:note});
  sfx(key==='pill'?(note.indexOf('不错')>=0?'heal':'bad'):({cigarette:'heal',cuff:'cuff',phone:'info',mag:'info',inv:'inv',beer:'beer',adr:'steal',dtrg:'trigger'}[key]||'item'));
  save();render();
  if(!silent){
    showItemResult(key,note);
    return note;
  }
  return pub;
}

/* ---------------- 渲染 ---------------- */
function fmtPct(p){
  var v=Math.round(p*1000)/10;
  return (v%1===0)?String(Math.round(v)):v.toFixed(1);
}
function shellStrip(n){
  if(!n)return '<span class="none">— 空 —</span>';
  var s='',i;
  for(i=0;i<n;i++)s+='<span class="shell mini">?</span>';
  return s;
}
function hearts(hp,max){
  var s='',i;
  for(i=0;i<max;i++)s+='<span class="'+(i<hp?'hf':'he')+'">'+(i<hp?'♥':'♡')+'</span>';
  return s;
}
function itembarHtml(r,side){
  var inv=r.items[side],slots='',i;
  var active=isViewingCurrent()&&!deadOf(r);
  var clickable=active&&side===r.turn;
  var seen={},stacks=[];
  for(i=0;i<inv.length;i++){
    var k=inv[i];
    if(seen[k]){seen[k].c++;continue}
    seen[k]={k:k,i:i,c:1};
    stacks.push(seen[k]);
  }
  for(i=0;i<stacks.length;i++){
    var stk=stacks[i],badge=(stk.c>1?'<span class="cnt">'+stk.c+'</span>':'');
    var tip=ITEMS[stk.k].n+(stk.c>1?' ×'+stk.c:'');
    slots+=(clickable
      ?'<button class="item-slot" data-action="item" data-k="'+stk.k+'" data-i="'+stk.i+'" data-side="'+side+'" aria-label="'+tip+'">'+ic(stk.k)+badge+'</button>'
      :'<span class="item-slot" title="'+tip+'">'+ic(stk.k)+badge+'</span>');
  }
  for(i=inv.length;i<8;i++)slots+='<span class="item-slot empty"></span>';
  return '<div class="itembar-title">'+NAME[side]+'的道具（'+inv.length+'/8）'+(clickable?' · 点击使用':'')+'</div><div class="itembar">'+slots+'</div>';
}
function intelHtml(r){
  var chips=[],p;
  if(r.lastEject)chips.push('<span class="info-chip">上退(M'+r.lastEject.mag+')：'+(r.lastEject.result==='live'?'实弹':'空包')+'</span>');
  var ks=[];
  for(p in r.known)ks.push(parseInt(p,10));
  ks.sort(function(a,b){return a-b});
  for(p=0;p<ks.length;p++){
    var pos=ks[p],t=r.known[pos];
    chips.push('<span class="info-chip '+t+'">第'+pos+'发 '+(t==='live'?'实弹':'空包')+'</span>');
  }
  var news='';
  if(r.news&&r.news.length){
    var nl=r.news.slice(-5),ni;
    news='<details class="newsbox"><summary>📡 情报来源（'+r.news.length+' 条）</summary>';
    for(ni=0;ni<nl.length;ni++)news+='<div class="news-i"><span class="m">M'+nl[ni].m+'</span>'+nl[ni].txt+'</div>';
    news+='</details>';
  }
  if(!chips.length&&!news)return '';
  return news+'<div class="infobar">'+chips.join('')+'</div>';
}
function shotRow(s,i,total){
  var last=(i===total-1)?' last':'';
  var dmg='';
  if(s.result==='live'){
    var victim=(s.target==='self')?s.shooter:other(s.shooter);
    dmg='<span class="dmg">−'+(s.dmg||1)+'♥ '+(victim==='player'?NAME.player:NAME.opponent)+'</span>';
  }
  var mtag=(s.mag&&s.mag>1)?'<span class="mtag">弹'+s.mag+'</span>':'';
  return '<li class="shot '+s.result+last+'">'
    +'<span class="no">#'+(i+1)+'</span>'
    +'<span class="who">'+NAME[s.shooter]+' → '+TARGET[s.target]+' '+mtag+dmg+'</span>'
    +'<span class="tag">'+(s.result==='live'?'💥 实弹':'💨 空包')+'</span></li>';
}
function shotsHtml(r,interactive){
  var all=r.pastShots.concat(r.fired);
  if(!all.length)return '<div class="empty">尚未开枪 — 点击下方按钮开始</div>';
  var html='<ul class="shots">'+all.map(function(s,i){return shotRow(s,i,all.length)}).join('')+'</ul>';
  if(interactive&&r.fired.length)html+='<button class="ghost" data-action="undo">↩ 撤销上一枪</button>';
  return html;
}

function render(){renderBar();renderMain();renderSound()}

function renderBar(){
  var nav=$('#roundBar');
  if(!state.rounds.length){nav.innerHTML='';return}
  var html='',i;
  for(i=0;i<state.rounds.length;i++){

/* ---------------- 音效（WebAudio 全合成，无外部文件） ---------------- */
function tone(f0,f1,dur,type,vol,at){
  var t=AC.currentTime+(at||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(Math.max(1,f0),t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03);
}
function nz(dur,vol,freq,type,at){
  var t=AC.currentTime+(at||0),len=Math.max(1,Math.floor(AC.sampleRate*dur)),
      b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  var s=AC.createBufferSource();s.buffer=b;
  var f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||1200;
  var g=AC.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
}
function sfx(kind){
  if(state.muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    switch(kind){
      case 'live': /* 实弹爆响：低频下坠 + 破裂噪声 + 高频脆响 */
        tone(160,38,.42,'sine',.5);nz(.12,.35,2500);nz(.05,.22,6000,'highpass');break;
      case 'blank': /* 空包：高压气噗 */
        nz(.09,.18,900,'highpass');break;
      case 'heal': /* 回复血量：上行暖音（G4→C5） */
        tone(392,392,.09,'triangle',.16);tone(523.25,523.25,.16,'triangle',.16,.09);break;
      case 'bad': /* 负面效果/受损：下行锯齿嗡鸣 */
        tone(220,150,.3,'sawtooth',.13);break;
      case 'cuff': /* 手铐：金属碰撞咔哒 */
        nz(.06,.16,4200,'highpass');tone(1318.5,1318.5,.05,'square',.07);tone(1760,1760,.07,'square',.06,.07);break;
      case 'info': /* 放大镜/手机：声呐回响 */
        tone(1244.5,880,.16,'sine',.14);tone(880,880,.1,'sine',.1,.15);break;
      case 'inv': /* 逆转器：上下来回滑音 */
        tone(330,660,.12,'triangle',.13);tone(660,330,.13,'triangle',.13,.12);break;
      case 'beer': /* 啤酒：开瓶闷响 + 气泡嘶嘶 */
        nz(.07,.28,600);nz(.32,.1,2600,'highpass',.1);break;
      case 'steal': /* 兴奋剂：噪声扫掠 + 上滑抢夺 */
        nz(.16,.13,3000,'bandpass');tone(500,950,.16,'sine',.1);break;
      case 'trigger': /* 双发扳机：两声上膛咔哒 */
        tone(185,185,.045,'square',.12);nz(.03,.14,4000,'highpass');
        tone(140,140,.055,'square',.12,.1);nz(.03,.14,3600,'highpass',.1);break;
      case 'deal': /* 获得道具：三连上行琶音（C5-E5-G5） */
        tone(523.25,523.25,.09,'triangle',.13);tone(659.25,659.25,.09,'triangle',.13,.09);tone(783.99,783.99,.14,'triangle',.13,.18);break;
      case 'reload': /* 装弹：三声弹壳咔哒 */
        nz(.04,.2,3600,'highpass');nz(.04,.2,3000,'highpass',.1);nz(.04,.2,3300,'highpass',.2);break;
      case 'win': /* 胜利：大调琶音（C5-E5-G5-C6） */
        tone(523.25,523.25,.13,'triangle',.17);tone(659.25,659.25,.13,'triangle',.17,.13);tone(783.99,783.99,.13,'triangle',.17,.26);tone(1046.5,1046.5,.26,'triangle',.17,.39);break;
      case 'lose': /* 失败：下行阴郁三音 */
        tone(311.1,311.1,.22,'sine',.15);tone(233.1,233.1,.26,'sine',.15,.22);tone(155.6,155.6,.42,'sine',.15,.48);break;
      default: /* ui：轻点 */
        tone(660,660,.06,'square',.05);
    }
  }catch(e){}
}

/* ---------------- 事件委托 ---------------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');
  if(!el)return;
  var a=el.getAttribute('data-action');
  if(a==='fire')fire(el.getAttribute('data-t'));
  else if(a==='undo')undo();
  else if(a==='turn')toggleTurn();
  else if(a==='next')nextAction();
  else if(a==='giveup'){confirmModal({icon:'🆕',title:'放弃本局重开？',body:'当前对局进度将作废，重新开始一局。',ok:'重开一局',danger:true,onOk:startMatch})}
  else if(a==='item'){showItemPanel(el.getAttribute('data-side'),el.getAttribute('data-k'),parseInt(el.getAttribute('data-i'),10))}
  else if(a==='item-use'){closeOv();useItem(el.getAttribute('data-side'),el.getAttribute('data-k'),parseInt(el.getAttribute('data-i'),10),false)}
  else if(a==='adr-steal'){var asd=el.getAttribute('data-side');closeOv();useItem(asd,'adr',parseInt(el.getAttribute('data-i'),10),false,el.getAttribute('data-k'))}
  else if(a==='item-ok'){closeOv();afterAction()}
  else if(a==='settings')openSettings();
  else if(a==='set-toggle'){var k=el.getAttribute('data-k');settings.items[k]=!settings.items[k];saveSettings();openSettings();sfx('ui')}
  else if(a==='set-default'){settings=defaultSettings();saveSettings();openSettings();toast('已恢复默认设置');sfx('ui')}
  else if(a==='view'){state.view=parseInt(el.getAttribute('data-i'),10);save();render();sfx('ui')}
  else if(a==='wipe')wipe();
  else if(a==='sound'){state.muted=!state.muted;save();renderSound();if(!state.muted)sfx('ui')}
  else if(a==='ov-skip')closeOv();
  else if(a==='ov-close')closeOv();
  else if(a==='ov-continue'){closeOv();afterAction()}
  else if(a==='ov-ok'){var f=pendingOk;pendingOk=null;closeOv();if(f)f()}
  else if(a==='ov-cancel'){pendingOk=null;closeOv()}
});

/* ---------------- 启动 ---------------- */
settings=loadSettings();
state=loadState();
if(!state){state={rounds:[],view:-1,muted:false};startMatch()}
else render();
</script>
